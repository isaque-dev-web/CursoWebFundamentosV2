<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>

    <body>
        <script>
            let meuDado = 10

            switch (typeof meuDado) {

                case "string":
                    alert("O tipo da variável é texto ")
                    break

                case "boolean":
                    alert("O tipo da variável é boleana")
                    break

                case "number":
                    alert("O tipo da variável é número")
                    break

                case "undefined":
                    alert("O tipo da variável é undefined")
                    
                default:
                    alert("Digite a variável")
            }
        </script>
    </body>
</html>
