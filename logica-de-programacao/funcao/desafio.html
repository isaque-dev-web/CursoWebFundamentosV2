<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Desafios</title>
    </head>

    <body>
        <script>
            
            function somar(n1, n2){
                return n1 + n2
            }
            console.log(somar(2, 4))

            function calcular(n1, n2, simbolo){
                switch (simbolo) {
                    case "+":
                        return n1 + n2
                    case "-":
                        return n1 - n2
                    case "*":
                        return n1 * n2
                    case "/":
                        return n1 / n2
                    default:
                        return null
                }
            }

            console.log(calcular(2, 4, "+"))
            console.log(calcular(2, 4, "-"))
            console.log(calcular(2, 4, "*"))
            console.log(calcular(2, 4, "/"))
            console.log(calcular(2, 4, "a"))

            function verificarParOuImpar(n){
                return n % 2 === 0
            }
            console.log(verificarParOuImpar(5));
            console.log(verificarParOuImpar(4));

            function ehBissexto(ano){
                return (ano % 4 === 0 && ano % 100 !== 0) || ano % 400 === 0;
            }

            console.log(ehBissexto(2042))
            console.log(ehBissexto(2100))
            console.log(ehBissexto(2000))
        </script>
    </body>
</html>
