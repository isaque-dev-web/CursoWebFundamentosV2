<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Função área do Círculo</title>
    </head>

    <body>
        <h1>Função área do Círculo</h1>

        <label>Raio
            <input type="number" id="raio">
        </label>
        <br>
        <button onclick="mostrarAreaDoPromptAlert()">Calcular a área do Prompt e mostrar no alert</button>
        <button onclick="mostrarAreaDoInputAlert()">Calcular a área do input e mostrar no alert</button>
        <br>
        <button onclick="mostrarAreaDoPromptOutput()">Calcular a área do Prompt</button>
        <button onclick="mostrarAreaDoInputOutput()">Calcular a área do input</button>
        <output id="output"></output>

        <script>
            const raio = document.getElementById("raio")
            const output = document.getElementById("output")

        //    function mostrarAreaDoPrompt() {
        //        let raioValue = parseFloat(prompt("Digite o raio"))
        //        mostrarArea(raioValue)
        //    }

        //    function mostrarAreaDoInput() {
        //        let raioValue = parseFloat(raio.value)
        //        mostrarArea(raioValue)
        //    }

           function mostrarAreaDoPromptAlert() {
               let raio = parseFloat(prompt("Digite o raio"))
               let area = calcularArea(raio)
               alert(`A área da circunferência de raio ${raio} é ${area}`)
           }

           function mostrarAreaDoInputAlert() {
               let raioInput = parseFloat(raio.value)
               let area = calcularArea(raioInput)
               alert(`A área da circunferência de raio ${raioInput} é ${area}`)
           }

           function mostrarAreaDoPromptOutput() {
               let raio = parseFloat(prompt("Digite o raio"))
               let area = calcularArea(raio)
               output.innerHTML = `A área da circunferência de raio ${raio} é ${area}`
           }

           function mostrarAreaDoInputOutput() {
               let raioInput = parseFloat(raio.value)
               let area = calcularArea(raioInput)
               output.innerHTML = `A área da circunferência de raio ${raioInput} é ${area}`
           }

           function calcularArea(raio) {
               const pi = Math.PI
               let area = pi * raio ** 2
               return area
           }
        </script>
    </body>
</html>
