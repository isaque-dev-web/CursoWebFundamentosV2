<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>

    <body>
        <h1>Arrays</h1>

        <script>
           const numeros = [2, 4, undefined, 7, 72, "65", 90, 47, "Texto", false, [], null]

           let soma = 0 

           for (let i = 0; i < numeros.length; i++){
            let n = numeros[i]

            if(typeof n === "number"){
                soma = soma + n
            }

           }

           alert("A soma de todos os números é: " + soma)
        </script>
    </body>
</html>
