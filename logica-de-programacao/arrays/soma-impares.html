<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>

    <body>
        <h1>Arrays</h1>

        <script>
           const numeros = [2, 3, 5, 6, 2, 7, 19, 21]

           let soma = 0

           for (let i = 0; i < numeros.length; i++){
               let n = numeros[i]

               if(n % 2 !== 0){
                soma += n
               }

           }

           alert("A soma dos números impares é " + soma)
        </script>
    </body>
</html>
