<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>

    <body>
        <h1>Arrays</h1>

        <script>
            let nomes = ["João", "Maria", "isaque", "Beatriz", "Maitê"] // sintaxe literal

            for(let i = 0; i < nomes.length; i++){
                document.write("nome: " + nomes[i] + "<br>")
            }
        </script>
    </body>
</html>
