<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tipos primitivos</title>
    </head>

    <body>
        <h1>Métodos</h1>

        <script>
            const produto = {
                nome: "caneta",
                quantidade: 10,
                comprar: function(qtd) {
                    if (qtd > this.quantidade) {
                        console.log("quantidade insuficiante, quantidade em estoque é de ", this.quantidade)
                        return null
                    }

                    console.log(`comprar caneta`)
                    this.quantidade -= qtd
                },
                teste1: function(){
                    console.log("teste1")
                    console.log(this)
                },
                teste2: () => {
                    console.log("teste2")
                    console.log(this)
                }
            }

            console.log(produto)

            produto.quantidade -= 3

            console.log(produto)

            produto.quantidade -= 14

            produto.quantidade = 10

            produto.comprar(3)

            produto.comprar(13)

            produto.teste1()
            produto.teste2()
            console.log(produto)
        </script>
    </body>
</html>
