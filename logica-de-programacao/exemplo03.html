<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Primeiro desafio</title>
    </head>

    <body>
        <h1>Primeiro desafio</h1>

        <script>
            let num1 = prompt('Digite um número: ')
            num1 = parseInt(num1)

            let num2 = prompt('Digite um número: ')
            num2 = parseInt(num2)

            // let div = num1 / num2
            // let multi = num1 * num2
            // let sub = num1 - num2
            // let soma = num1 + num2
            // let rest = num1 % num2

            alert('A divisão é: ' + (num1 / num2))
            alert('A multiplicação é: ' + (num1 * num2))
            alert('A subtração é: ' + (num1 - num2))
            alert('A soma é: ' + (num1 + num2))
            alert('O resto é: ' + (num1 % num2))
        </script>
    </body>
</html>
